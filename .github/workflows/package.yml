name: package

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"
    branches:
      - main
      - cursor/rc-stm-peci-587c

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_package: ${{ steps.d.outputs.should_package }}
      should_release: ${{ steps.d.outputs.should_release }}
      tag: ${{ steps.d.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        name: decide package / release
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)
          TAG="v${VER}"
          echo "cargo version ${VER} tag ${TAG} ref ${GITHUB_REF} event ${GITHUB_EVENT_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_EVENT_NAME}" == pull_request || "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            echo "should_package=1" >> "$GITHUB_OUTPUT"
            echo "should_release=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            GOT="${GITHUB_REF#refs/tags/}"
            if [[ "${GOT}" != "${TAG}" ]]; then
              echo "tag ${GOT} does not match Cargo.toml v${VER}" >&2
              exit 1
            fi
            echo "tag=${GOT}" >> "$GITHUB_OUTPUT"
            echo "should_package=1" >> "$GITHUB_OUTPUT"
            echo "should_release=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 栈顶 / main：Cargo.toml 还没有对应 tag 才打包并发版。
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "tag ${TAG} already exists; skip rebuild/release"
            echo "should_package=0" >> "$GITHUB_OUTPUT"
            echo "should_release=0" >> "$GITHUB_OUTPUT"
          else
            echo "should_package=1" >> "$GITHUB_OUTPUT"
            echo "should_release=1" >> "$GITHUB_OUTPUT"
          fi

  cli:
    needs: gate
    if: needs.gate.outputs.should_package == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build CLI
        run: ./scripts/build-cli.sh
      - name: smoke CLI
        env:
          AIDA_SMOKE_REQUIRE: cli
        run: chmod +x scripts/smoke-dist.sh && ./scripts/smoke-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aida-cli
          path: dist/aida-cli-*
          if-no-files-found: error

  appimage:
    needs: gate
    if: needs.gate.outputs.should_package == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libegl1 libgl1 libglx-mesa0 curl
      - name: build AppImage
        run: ./scripts/build-appimage.sh
      - name: smoke AppImage
        env:
          AIDA_SMOKE_REQUIRE: appimage
        run: chmod +x scripts/smoke-dist.sh && ./scripts/smoke-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aida-appimage
          path: dist/AIDA_Linux-*.AppImage
          if-no-files-found: error

  bundle:
    needs: [gate, cli, appimage]
    if: needs.gate.outputs.should_package == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: make installable tarball
        run: |
          chmod +x scripts/make-bundle.sh scripts/smoke-dist.sh
          ./scripts/make-bundle.sh
      - name: smoke tarball
        env:
          AIDA_SMOKE_REQUIRE: cli,appimage,tarball
        run: ./scripts/smoke-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aida-linux
          path: |
            dist/aida-linux-*.tar.gz
            dist/SHA256SUMS
            dist/aida-cli-*
            dist/AIDA_Linux-*.AppImage
          if-no-files-found: error
          retention-days: 30

  test:
    needs: gate
    if: needs.gate.outputs.should_release == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: lib tests
        run: cargo test --lib
      - name: live collect
        run: cargo test --test live_collect

  release:
    needs: [gate, bundle, test]
    if: needs.gate.outputs.should_release == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aida-linux
          path: dist
      - name: smoke release assets
        env:
          AIDA_SMOKE_REQUIRE: cli,appimage,tarball
        run: chmod +x scripts/smoke-dist.sh && ./scripts/smoke-dist.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            解压 `aida-linux-*-*.tar.gz` 即可用，**不需要安装 Rust**。

            ```bash
            tar -xzf aida-linux-*.tar.gz
            cd aida-linux-*
            ./run-gui.sh                         # 桌面
            ./run-collect.sh --html report.html  # 服务器
            sha256sum -c SHA256SUMS
            ```

            无 FUSE 时：`APPIMAGE_EXTRACT_AND_RUN=1 ./AIDA_Linux-*.AppImage gui`
          files: |
            dist/aida-linux-*.tar.gz
            dist/SHA256SUMS
            dist/aida-cli-*
            dist/AIDA_Linux-*.AppImage
