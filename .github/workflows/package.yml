name: package

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build CLI
        run: ./scripts/build-cli.sh
      - name: smoke CLI
        env:
          AIDA_SMOKE_REQUIRE: cli
        run: chmod +x scripts/smoke-dist.sh && ./scripts/smoke-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aida-cli
          path: dist/aida-cli-*
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libegl1 libgl1 libglx-mesa0 curl
      - name: build AppImage
        run: ./scripts/build-appimage.sh
      - name: smoke AppImage
        env:
          AIDA_SMOKE_REQUIRE: appimage
        run: chmod +x scripts/smoke-dist.sh && ./scripts/smoke-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aida-appimage
          path: dist/AIDA_Linux-*.AppImage
          if-no-files-found: error

  bundle:
    needs: [cli, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: make installable tarball
        run: |
          chmod +x scripts/make-bundle.sh scripts/smoke-dist.sh
          ./scripts/make-bundle.sh
      - name: smoke tarball
        env:
          AIDA_SMOKE_REQUIRE: cli,appimage,tarball
        run: ./scripts/smoke-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aida-linux
          path: |
            dist/aida-linux-*.tar.gz
            dist/SHA256SUMS
            dist/aida-cli-*
            dist/AIDA_Linux-*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aida-linux
          path: dist
      - name: smoke release assets
        env:
          AIDA_SMOKE_REQUIRE: cli,appimage,tarball
        run: chmod +x scripts/smoke-dist.sh && ./scripts/smoke-dist.sh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            解压 `aida-linux-*-*.tar.gz` 即可用，**不需要安装 Rust**。

            ```bash
            tar -xzf aida-linux-*.tar.gz
            cd aida-linux-*
            ./run-gui.sh                         # 桌面
            ./run-collect.sh --html report.html  # 服务器
            sha256sum -c SHA256SUMS
            ```

            无 FUSE 时：`APPIMAGE_EXTRACT_AND_RUN=1 ./AIDA_Linux-*.AppImage gui`
          files: |
            dist/aida-linux-*.tar.gz
            dist/SHA256SUMS
            dist/aida-cli-*
            dist/AIDA_Linux-*.AppImage
