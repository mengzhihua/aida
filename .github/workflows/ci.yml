name: ci

on:
  pull_request:
  push:
    branches: [main, cursor/rc-stm-peci-587c]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: lib tests
        run: cargo test --lib
      - name: live collect
        run: cargo test --test live_collect
      - name: CLI-only
        run: cargo test --no-default-features --lib
