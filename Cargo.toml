[package]
name = "aida"
version = "0.52.0"
edition = "2021"
rust-version = "1.88"
description = "Linux hardware inspection and monitoring (AIDA64-inspired)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mengzhihua/aida"
homepage = "https://github.com/mengzhihua/aida"
keywords = ["hardware", "sysfs", "sensors", "benchmark", "linux"]
categories = ["os::linux-apis", "hardware-support"]

[lib]
name = "aida"
path = "src/lib.rs"

[[bin]]
name = "aida"
path = "src/main.rs"

[features]
default = ["gui"]
# eframe/egui 仅用于桌面界面；采集/导出/基准测试不依赖 GUI。
gui = ["dep:eframe", "dep:egui_plot"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

eframe = { version = "=0.29.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11"] }
egui_plot = { version = "=0.29.0", optional = true }

# egui 0.29 在指针移动后会再要一帧 0 延迟重绘，egui-winit 对每次移动也
# request_redraw。软件 GL 上那一帧要几十毫秒，鼠标一密就把核占满。
# 这里换成同版本，只把移动重绘封顶。
[patch.crates-io]
egui = { path = "third_party/egui" }
egui-winit = { path = "third_party/egui-winit" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
